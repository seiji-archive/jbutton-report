<html lang="ko">
<head>

<title>제이버튼 인스타그램 업로드 안내</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --purple: #7F77DD; --purple-light: #EEEDFE; --purple-dark: #534AB7;
    --amber: #BA7517; --amber-light: #FAEEDA;
    --gray-light: #F4F4F2;
    --line: #E0DED8; --text: #1A1A18; --text-sec: #5F5E5A; --text-muted: #888780;
    --white: #FFFFFF; --bg: #F8F7F4;
    --tag-info: #4A3FE0; --tag-brand: #7B2FA8; --tag-conv: #E2572B; --tag-video: #3D7A6E;
    --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
    --font: 'Noto Sans KR', sans-serif;
  }
  html { scroll-behavior: smooth; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
  .page { max-width: 800px; margin: 0 auto; padding: 48px 40px; background: var(--white); min-height: 100vh; }

  .report-header { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 24px; }
  .header-accent { width: 3px; height: 64px; background: var(--purple); border-radius: 2px; flex-shrink: 0; margin-top: 2px; }
  .header-period { font-size: 11px; color: var(--text-muted); letter-spacing: .06em; margin-bottom: 4px; }
  .header-title { font-size: 24px; font-weight: 700; color: var(--text); line-height: 1.25; }

  .summary-label { font-size: 12px; font-weight: 700; color: var(--text-sec); margin: 28px 0 8px; }
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .summary a { display: block; text-decoration: none; color: inherit; background: var(--gray-light); border: 0.5px solid var(--line); border-radius: var(--radius-md); padding: 14px; }
  .summary a:hover { border-color: var(--purple); }
  .summary-date { font-size: 12px; color: var(--text-muted); margin: 8px 0 2px; }
  .summary-title { font-size: 13px; font-weight: 700; line-height: 1.45; }

  .toc { position: sticky; top: 0; z-index: 10; display: flex; gap: 6px; overflow-x: auto; margin: 32px -40px 24px; padding: 12px 40px; background: rgba(255,255,255,.96); border-bottom: 0.5px solid var(--line); scrollbar-width: none; }
  .toc::-webkit-scrollbar { display: none; }
  .toc a { flex-shrink: 0; font-size: 12px; font-weight: 500; color: var(--text-sec); text-decoration: none; padding: 6px 12px; border-radius: 20px; background: var(--gray-light); border: 0.5px solid var(--line); white-space: nowrap; }
  .toc a span { color: var(--text-muted); margin-right: 4px; }
  .toc a:hover { color: var(--purple-dark); border-color: var(--purple); }
  .toc a.active { background: var(--purple-light); color: var(--purple-dark); border-color: var(--purple); font-weight: 700; }
  .toc a.active span { color: var(--purple); }

  .sec-label { font-size: 10px; font-weight: 700; color: var(--text-muted); letter-spacing: .1em; margin-bottom: 8px; }
  .sec-label[id] { scroll-margin-top: 72px; }
  .sec-title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 16px; line-height: 1.4; }
  hr.divider { border: none; border-top: 0.5px solid var(--line); margin: 40px 0; }

  .tag { display: inline-block; font-size: 11px; font-weight: 700; color: #fff; padding: 2px 8px; border-radius: 4px; line-height: 1.5; white-space: nowrap; }
  .tag.info { background: var(--tag-info); }
  .tag.brand { background: var(--tag-brand); }
  .tag.conv { background: var(--tag-conv); }
  .tag.video { background: var(--tag-video); }

  /* 캘린더 */
  .cal-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .cal-top .sec-title { margin-bottom: 0; }
  .month-nav { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .month-nav button { width: 32px; height: 32px; border-radius: 50%; border: 0.5px solid var(--line); background: var(--white); color: var(--text); font-size: 16px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .month-nav button:hover:not(:disabled) { border-color: var(--purple); color: var(--purple-dark); }
  .month-nav button:disabled { opacity: .3; cursor: default; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 0.5px solid var(--line); border-left: 0.5px solid var(--line); }
  .cal-head { font-size: 11px; font-weight: 700; text-align: center; padding: 6px 0; color: #fff; background: #75736E; border-right: 0.5px solid var(--line); }
  .cal-head.sun { background: #D0342C; }
  .cal-head.sat { background: #A8A6A0; }
  .cal-day { min-height: 96px; padding: 6px; border-right: 0.5px solid var(--line); border-bottom: 0.5px solid var(--line); font-size: 11px; }
  .cal-day.this-week { background: #FBFAFF; }
  .cal-day.other { color: var(--text-muted); }
  .cal-day.other .cal-text { opacity: .6; }
  .cal-num { display: flex; align-items: center; justify-content: space-between; gap: 4px; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  .cal-num.sun { color: #D0342C; }
  .cal-num.sat { color: var(--text-muted); }
  .cal-num .tag { font-size: 10px; padding: 1px 5px; }
  .cal-text { line-height: 1.45; color: var(--text-sec); word-break: keep-all; }
  .cal-day.this-week .cal-text { color: var(--text); font-weight: 500; }
  .cal-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--text-muted); margin-top: 10px; align-items: center; }
  .cal-legend .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: #FBFAFF; border: 1px solid var(--purple); vertical-align: -1px; margin-right: 4px; }
  .tag .short { display: none; }

  /* 게시물 */
  .post-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .post-head .sec-title { margin-bottom: 0; }

  .carousel { position: relative; margin: 0 -40px 20px; }
  .track { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0 40px; scrollbar-width: none; scroll-padding: 0 40px; }
  .track::-webkit-scrollbar { display: none; }
  .card { flex: 0 0 300px; scroll-snap-align: start; position: relative; }
  .card img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 5; object-fit: cover; border-radius: var(--radius-md); background: var(--gray-light); }
  .card .ph { display: flex; align-items: center; justify-content: center; width: 100%; aspect-ratio: 4 / 5; border-radius: var(--radius-md); background: var(--gray-light); border: 0.5px dashed var(--line); font-size: 12px; color: var(--text-muted); }
  .card-num { position: absolute; top: 8px; right: 8px; font-size: 10px; font-weight: 700; color: #fff; background: rgba(0,0,0,.45); padding: 2px 7px; border-radius: 10px; }
  .nav-btn { position: absolute; top: calc(50% - 18px); width: 36px; height: 36px; border-radius: 50%; border: 0.5px solid var(--line); background: rgba(255,255,255,.95); color: var(--text); font-size: 18px; line-height: 1; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.12); display: flex; align-items: center; justify-content: center; }
  .nav-btn:disabled { opacity: 0; pointer-events: none; }
  .nav-btn.prev { left: 12px; }
  .nav-btn.next { right: 12px; }
  .dots { display: flex; justify-content: center; gap: 5px; margin-top: 10px; }
  .dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
  .dots span.on { background: var(--purple); }

  .caption-box { border: 0.5px solid var(--line); border-radius: var(--radius-md); overflow: hidden; margin-bottom: 12px; }
  .caption-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--gray-light); border-bottom: 0.5px solid var(--line); }
  .caption-bar-title { font-size: 12px; font-weight: 700; color: var(--text-sec); }
  .copy-btn { font-family: var(--font); font-size: 12px; font-weight: 500; color: var(--purple-dark); background: var(--white); border: 0.5px solid var(--purple); border-radius: 20px; padding: 4px 12px; cursor: pointer; }
  .copy-btn.done { background: var(--purple); color: #fff; }
  .caption { padding: 16px 18px; font-size: 14px; line-height: 1.8; white-space: pre-line; color: var(--text); }

  .note { border-radius: var(--radius-md); padding: 12px 16px; background: var(--amber-light); border: 0.5px solid var(--amber); font-size: 13px; color: #854F0B; line-height: 1.7; margin-bottom: 8px; word-break: break-all; }
  .note strong { color: #633806; }
  .note a { color: #633806; }

  .drive-line { font-size: 12px; color: var(--text-muted); margin-top: 32px; line-height: 1.7; }

  .summary-label { scroll-margin-top: 72px; }
  .toc .new { font-size: 10px; font-weight: 700; color: var(--purple); margin-left: 4px; }

  @media (max-width: 640px) {
    /* 모바일: 달력 형태 유지. 칸이 좁아 문구는 글자 단위로 줄바꿈 */
    .cal { margin: 0 -12px; }
    .cal-head { font-size: 10px; padding: 5px 0; }
    .cal-head .yo { display: none; }
    .cal-day { min-height: 64px; padding: 5px 3px 6px; }
    .cal-num { flex-direction: column; align-items: flex-start; gap: 3px; font-size: 12px; margin-bottom: 4px; }
    .cal-num .tag { font-size: 9px; padding: 1px 4px; letter-spacing: -.02em; }
    .tag .full { display: none; }
    .tag .short { display: inline; }
    .cal-text { font-size: 10px; line-height: 1.35; letter-spacing: -.03em; word-break: break-all; }
    .cal-legend { font-size: 10px; gap: 8px; }
  }
  @media (max-width: 480px) {
    body { font-size: 14px; } .page { padding: 28px 20px; }
    .header-title { font-size: 20px; } .sec-title { font-size: 17px; }
    .summary { gap: 6px; }
    .summary a { padding: 10px 9px; }
    .summary .tag { font-size: 10px; padding: 1px 6px; }
    .summary-date { font-size: 11px; margin: 6px 0 2px; }
    .summary-title { font-size: 12px; line-height: 1.4; word-break: keep-all; }
    .toc { margin: 24px -20px 20px; padding: 10px 20px; }
    .carousel { margin: 0 -20px 20px; }
    .track { padding: 0 20px; scroll-padding: 0 20px; }
    .card { flex-basis: 82%; }
    .nav-btn { display: none; }
    .caption { font-size: 13px; padding: 14px 16px; }
    hr.divider { margin: 28px 0; }
  }
</style>
</head>

        function fallback() {
          var ta = document.createElement('textarea'), ok = false; ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select();
          try { ok = document.execCommand('copy'); } catch (err) {}
          document.body.removeChild(ta);
          if (ok) return done();
          // 복사가 막힌 환경: 캡션을 선택해 두고 직접 복사하도록 안내
          var r = document.createRange(), sel = window.getSelection();
          r.selectNodeContents(cap); sel.removeAllRanges(); sel.addRange(r);
          btn.textContent = '선택됨 · 직접 복사해주세요';
          setTimeout(function () { btn.textContent = label; }, 2500);
        }
        if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done, fallback); return; }
        fallback();
      });
    }

    /* 주차 표시 */
    function show(w) {
      cur = w;
      var r = range(w), latest = w === WEEKS[WEEKS.length - 1];
      viewMonth = weekMonth(w);
      $('period').textContent = (r[0].getMonth() + 1) + '월 ' + r[0].getDate() + '일 — ' + (r[1].getMonth() + 1) + '월 ' + r[1].getDate() + '일 · ' + (latest ? '차주 업로드 안내' : '지난 주차');
      $('title').textContent = '제이버튼 인스타그램 ' + w.label;
      document.title = '제이버튼 ' + w.label + ' 업로드 안내';
      $('legend').textContent = w.label + ' (' + md(r[0]) + ' — ' + md(r[1]) + ')';
      $('summary-label').textContent = w.label + ' 업로드';
      renderCal();

      var sum = '', posts = '';
      w.posts.forEach(function (p, i) {
        var n = i + 1, num = ('0' + (n + 1)).slice(-2), d = p[0].split('/');
        var dt = day(r[0].getFullYear() + (+d[0] < r[0].getMonth() + 1 ? 1 : 0), +d[0], +d[1]), dow = DAYS[dt.getDay()];
        sum += '<a href="#p' + n + '">' + tag(p[1]) + '<div class="summary-date">' + p[0] + ' (' + dow + ')</div><div class="summary-title">' + esc(p[2]) + '</div></a>';
        posts += '<hr class="divider">' +
          '<div class="sec-label" id="p' + n + '">' + num + ' · ' + d[0] + '월 ' + d[1] + '일 (' + dow + ')</div>' +
          '<div class="post-head">' + tag(p[1]) + '<div class="sec-title">' + esc(p[2]) + '</div></div>' +
          '<div class="carousel" data-post="0' + n + '" data-count="' + p[3] + '"></div>' +
          '<div class="caption-box"><div class="caption-bar"><span class="caption-bar-title">캡션</span><button class="copy-btn" type="button">캡션 복사</button></div>' +
          '<div class="caption">' + esc(p[4]) + '</div></div>' +
          (p[5] ? '<div class="note">' + p[5] + '</div>' : '');
      });
      $('summary').innerHTML = sum;
      $('posts').innerHTML = posts;

      // 상단 칩: 캘린더 + 주차(최신부터)
      var toc = '<a href="#calendar"><span>01</span>캘린더</a>';
      WEEKS.slice().reverse().forEach(function (x, i) {
        toc += '<a href="#' + x.id + '" data-week="' + x.id + '"' + (x === w ? ' class="active"' : '') + '>' + x.label.replace(/\s/g, '') +
          (i === 0 ? '<span class="new">최신</span>' : '') + '</a>';
      });
      $('toc').innerHTML = toc;
      var on = document.querySelector('#toc a.active'), bar = $('toc');
      if (on && (on.offsetLeft < bar.scrollLeft || on.offsetLeft + on.offsetWidth > bar.scrollLeft + bar.clientWidth)) bar.scrollLeft = on.offsetLeft - 20;
      var folder = w.label.replace(/\s/g, '');
      $('drive').innerHTML = '카드 원본 이미지는 Google Drive <strong>' + folder + '</strong> 폴더에서 확인하실 수 있습니다.';

      document.querySelectorAll('#posts .carousel').forEach(function (box, i) { setupCarousel(box, w, '0' + (i + 1), +box.dataset.count); });
      document.querySelectorAll('#posts .copy-btn').forEach(setupCopy);
    }

    // 주차 칩: 그 주차로 바꾸고 업로드 목록 위치로 이동
    $('toc').addEventListener('click', function (ev) {
      var a = ev.target.closest('a[data-week]'); if (!a) return;
      ev.preventDefault(); ev.stopPropagation();
      if (location.hash !== '#' + a.dataset.week) history.pushState(null, '', '#' + a.dataset.week);
      route();
      $('summary-label').scrollIntoView({ behavior: 'smooth' });
    });

    /* 주소(#2026-11-3)로 주차 선택. 없으면 최신 주차 */
    function route() {
      var id = location.hash.slice(1);
      var w = WEEKS.filter(function (x) { return x.id === id; })[0];
      if (w) { if (w !== cur) show(w); return; }
      if (!cur || !id) show(WEEKS[WEEKS.length - 1]);
    }
    // 페이지 안 이동(칩·요약 카드)은 주소를 바꾸지 않고 스크롤만 한다 (주소에는 주차만 남김)
    document.addEventListener('click', function (ev) {
      var a = ev.target.closest('a[href^="#"]'); if (!a) return;
      var t = document.getElementById(a.getAttribute('href').slice(1)); if (!t) return;
      ev.preventDefault();
      t.scrollIntoView({ behavior: 'smooth' });
    });
    window.addEventListener('popstate', route);
    window.addEventListener('hashchange', route);
    route();
  })();
</script>
</body>
</html>
